name: roj_med
description: Roj Med - Daily Shop Account Tracker
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Cloud backend
  supabase_flutter: ^2.5.0

  # Local database (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage (PIN)
  flutter_secure_storage: ^9.2.2

  # PIN input UI
  pinput: ^4.0.0

  # Calendar view
  table_calendar: ^3.1.2

  # Number / currency formatting
  intl: ^0.19.0

  # Network connectivity
  connectivity_plus: ^6.0.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
